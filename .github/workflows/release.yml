name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DesktopTodo.exe
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: Run storage tests
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tests/run-storage-tests.ps1

      # UI 集成测试（734 断言）需要窗口/Dispatcher；GitHub Windows runner 的
      # session-0 桌面可以承载进程内 WPF 测试。已在 v1.1.0 的 CI 实跑验证通过，
      # 自此作为阻塞步骤：失败即中止构建，不发 Release。
      - name: Run UI tests
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tests/run-ui-tests.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopTodo-${{ github.ref_name }}
          path: dist/DesktopTodo.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # 语义化版本带预发布号（如 v1.0.1-rc.1）时标记为 pre-release，不抢占 Latest
          $ghArgs = @('release', 'create', $tag, 'dist/DesktopTodo.exe',
                      '--title', "桌面待办 $tag", '--generate-notes')
          if ($tag -match '-') { $ghArgs += '--prerelease' }
          gh @ghArgs || gh release upload $tag 'dist/DesktopTodo.exe' --clobber
